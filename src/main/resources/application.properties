# Default configuration shipped inside the jar.
# Values here are overridden by %APPDATA%/SalesManager/config.properties, which is where
# machine-specific settings and the database password live (CLAUDE.md section 8).
# Never put a password in this file - the jar can be unzipped.

app.name=Sales Manager

# ----- Database (used from M1 on) -----
db.url=jdbc:postgresql://localhost:5432/salesmanager
db.user=postgres
# db.password is intentionally absent. It is read from config.properties only.

# Small pool: this is a single-user desktop app, and a large pool only adds idle
# connections for PostgreSQL to keep alive.
db.pool.maxSize=5
db.pool.connectionTimeoutMs=10000

# ----- Backup (used from M4 on) -----
# How many pg_dump files to keep in %APPDATA%/SalesManager/backup before deleting the
# oldest. Losing receivables data is the biggest risk in this project (spec section 10).
backup.keepCount=10

# Absolute path to the PostgreSQL bin directory, only needed when pg_dump is not on PATH.
# Set it in config.properties, not here.
# backup.pgBinDir=
